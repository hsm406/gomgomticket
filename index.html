<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곰곰티켓</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f5f5f7; }

  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    background: #ffffff;
    border-bottom: 1px solid #eee;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, #d9a86c, #c07f4a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 800;
    color: #8a5a2e;
    letter-spacing: -0.5px;
  }

  .logo-text .sub {
    display: block;
    font-size: 10px;
    font-weight: 500;
    color: #999;
    letter-spacing: 1px;
  }

  nav.main-nav ul {
    list-style: none;
    display: flex;
    gap: 36px;
  }

  nav.main-nav a {
    text-decoration: none;
    color: #333;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    transition: color 0.15s ease;
  }

  nav.main-nav a:hover {
    color: #b06a2e;
  }

  @media (max-width: 720px) {
    .site-header { padding: 14px 20px; }
    nav.main-nav ul { gap: 16px; }
    nav.main-nav a { font-size: 13px; }
    .logo-text { font-size: 17px; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <a href="#" class="logo">
      <div class="logo-icon">🐻</div>
      <div class="logo-text">
        곰곰티켓
        <span class="sub">GOMGOM TICKET</span>
      </div>
    </a>

    <nav class="main-nav">
      <ul>
        <li><a href="#">소개</a></li>
        <li><a href="#">상품권매입</a></li>
        <li><a href="#">상품권판매</a></li>
        <li><a href="#">상담안내</a></li>
      </ul>
    </nav>
  </header>

</body>
</html>
